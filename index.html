
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leona's Birthday & Christening</title>
    <link rel="stylesheet" href="index.css">

</head>

<body>
    <main class="page">

       
        <img src="image/baby-new.png"
             class="baby-decoration" alt="">

       
        <div class="footprints left-footprints" aria-hidden="true">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
        </div>

        <div class="footprints right-footprints" aria-hidden="true">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
            <img src="image/footstep-new.png" alt="">
        </div>

        
        <span class="sparkle star-one">★</span>
        <span class="sparkle star-two">☆</span>
        <span class="sparkle star-three">★</span>
        <span class="sparkle heart-one">♡</span>
        <span class="sparkle heart-two">♥</span>

        
        <header class="heading">
            <p class="eyebrow">A LITTLE INVITATION FULL OF LOVE</p>

            <div class="heart-divider">
                <span></span> ♥ <span></span>
            </div>

            <h1>You've Been Specially Invited! ♡</h1>

            <p class="intro">
                A little celebration for our little princess
            </p>
        </header>

        
        <section class="welcome-box">
            <h2>Before we open your invitation...</h2>

            <p>What should we call you?</p>

            <input
                type="text"
                id="godparentName"
                placeholder="Enter your name here ♡"
                autocomplete="name"
            >

            <button id="continueButton" type="button">
                Continue to your invitation ♡
            </button>
        </section>

        <footer>
            <span>♥</span>
            Made with love for Leona's 1st Birthday &amp; Christening
            <span>♥</span>
        </footer>

    </main>

    <script src="script.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
